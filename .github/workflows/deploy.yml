name: Deploy Rata Audaz Final

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Crear config.js en la raíz
        run: |
          echo "const CONFIG = { 
            WEATHER_API_KEY: '${{ secrets.WEATHER_API_KEY }}', 
            CITY: '${{ secrets.CITY }}', 
            UNITS: 'metric', 
            LANG: 'es' 
          };" > ./config.js

      - name: Deploy a GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .        # Sube TODO lo que hay en la raíz
          branch: gh-pages
          clean: true
