name: Deploy Rata Audaz
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Crear config.js
        run: |
          echo "const CONFIG = {
            WEATHER_API_KEY: '${{ secrets.WEATHER_API_KEY }}',
            CITY: '${{ secrets.CITY }}',
            UNITS: 'metric',
            LANG: 'es'
          };" > config.js

      - name: Deploy a GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
